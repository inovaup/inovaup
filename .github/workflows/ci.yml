# CI do InovaUp (F6): roda em todo PR para a main e em todo push na main.
#
# Usa um Supabase LOCAL e temporário, criado aqui dentro do GitHub Actions:
# aplica as migrações, roda a semente e os testes de RLS, e descarta tudo no fim.
# Não usa o banco de dev compartilhado nem nenhum segredo do repositório.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint e testes (com Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Instalar a Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Sobe só o necessário (banco, login e API); as migrações entram sozinhas.
      - name: Subir o Supabase local
        run: >
          supabase start
          -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit

      # Roda TODOS os arquivos de supabase/verificacoes/ (núcleo, avaliação e os
      # que vierem). psql roda cada arquivo inteiro (vários comandos, com
      # BEGIN/ROLLBACK) e para no primeiro erro. Se falhar, o motivo vira uma
      # anotação visível no PR. Cada arquivo termina com "OK: todas as verificações...".
      - name: Verificações SQL de RLS
        run: |
          DB_URL=$(supabase status -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).DB_URL))')
          for arquivo in supabase/verificacoes/*.sql; do
            echo "== $arquivo"
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "$arquivo" > verificacao.txt 2> erro.txt; then
              cat verificacao.txt erro.txt
              echo "::error title=Verificação SQL ($arquivo)::$(tr '\n' ' ' < erro.txt | cut -c1-500)"
              exit 1
            fi
            cat verificacao.txt
            if ! grep -q "OK: todas as verificações" verificacao.txt; then
              echo "::error title=Verificação SQL ($arquivo)::terminou sem a linha OK"
              exit 1
            fi
          done

      # As chaves do Supabase local são as padrão de desenvolvimento (não são segredo).
      # Os nomes das variáveis seguem o .env.example.
      - name: Montar o .env.local do CI
        run: |
          supabase status -o json > status.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("status.json", "utf8"));
            const url = s.API_URL;
            const publica = s.PUBLISHABLE_KEY || s.ANON_KEY;
            const secreta = s.SECRET_KEY || s.SERVICE_ROLE_KEY;
            if (!url || !publica || !secreta) {
              console.error("Campos do supabase status:", Object.keys(s).join(", "));
              process.exit(1);
            }
            require("fs").writeFileSync(".env.local", [
              "NEXT_PUBLIC_SUPABASE_URL=" + url,
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + publica,
              "SUPABASE_SERVICE_ROLE_KEY=" + secreta,
              "",
            ].join("\n"));
            console.log(".env.local criado para", url);
          '
          rm status.json

      - name: Semente do núcleo
        run: |
          if ! npm run seed > semente.txt 2>&1; then
            cat semente.txt
            echo "::error title=Semente do núcleo::$(grep -m1 'Semente interrompida' semente.txt || tail -n 1 semente.txt)"
            exit 1
          fi
          cat semente.txt

      # Com CI=true (padrão do GitHub Actions), os testes de RLS FALHAM se faltar
      # configuração, em vez de serem pulados.
      - name: Testes (Vitest, incluindo RLS)
        run: npm test
